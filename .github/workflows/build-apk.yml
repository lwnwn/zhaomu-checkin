name: Build APK

name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载工程源码
        run: |
          URL="https://morning-evening-checkin.app.workbuddy.host/android-src.b64?sharecode=3ZAXZZSNON&t=$(date +%s)"
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 3 --retry-all-errors "$URL" -o src.b64; then
              ok=1
              break
            fi
            echo "第 $i 次下载失败，5 秒后重试..."
            sleep 5
          done
          test "$ok" = 1
          base64 -d src.b64 | tar xz
          test -f app/src/main/AndroidManifest.xml

      - name: 生成图标
        run: python3 ci_icons.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK 许可
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK/licenses/android-sdk-preview-license"
          echo "SDK=$SDK"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: 编译 APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: zhaomu-checkin-debug
          path: app/build/outputs/apk/debug/*.apk
