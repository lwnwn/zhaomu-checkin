name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 还原工程源码
        run: |
          f=$(ls -1 *.b64 2>/dev/null | head -1)
          if [ -z "$f" ]; then echo "仓库根目录没找到 .b64 源码包"; exit 1; fi
          echo "使用源码包: $f"
          base64 -d "$f" > src.tar.gz
          tar xzf src.tar.gz
          test -f app/src/main/AndroidManifest.xml
          echo "工程还原完成"

      - name: 生成图标
        run: python3 ci_icons.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK 许可
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK/licenses/android-sdk-preview-license"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: 编译 APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: zhaomu-checkin-debug
          path: app/build/outputs/apk/debug/*.apk
